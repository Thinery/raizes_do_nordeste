spring.application.name=raizesnordeste

spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:raizes_nordeste}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8090}

# JWT
app.jwt.secret=${JWT_SECRET:chave-padrao-apenas-para-desenvolvimento-troque-isso-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
